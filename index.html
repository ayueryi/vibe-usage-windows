<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Usage</title>
    <!-- Apply the cached choice before CSS/React loads to avoid a theme flash.
         Once connected, Rust settings replace this first-paint cache. -->
    <script>
      try {
        const preference = localStorage.getItem("vibe-usage-theme");
        document.documentElement.dataset.theme = preference === "light" || preference === "dark"
          ? preference : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
